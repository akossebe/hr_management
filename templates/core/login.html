<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - HR Pulse</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
        }
        .brand-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #4f46e5, #0ea5e9);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.8rem;
            margin: 0 auto 1.5rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand-icon shadow-lg">
            <i class="fa-solid fa-users-gear"></i>
        </div>
        <h3 class="text-center fw-bold text-dark mb-1">HR Pulse</h3>
        <p class="text-center text-muted fs-7 mb-4">Espace d'Administration RH</p>

        {% if form.errors %}
            <div class="alert alert-danger p-2 fs-7 text-center rounded-3">
                Nom d'utilisateur ou mot de passe incorrect.
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-semibold text-secondary fs-7">Nom d'utilisateur</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="fa-solid fa-user text-muted"></i></span>
                    <input type="text" name="username" class="form-control" required placeholder="admin">
                </div>
            </div>
            
            <div class="mb-4">
                <label class="form-label fw-semibold text-secondary fs-7">Mot de passe</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                    <input type="password" name="password" class="form-control" required placeholder="••••••••">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 shadow-sm">
                <i class="fa-solid fa-right-to-bracket me-2"></i> Se Connecter
            </button>
        </form>

        <div class="mt-4 text-center fs-7 text-muted">
            <i class="fa-solid fa-shield-halved me-1"></i> Connexion sécurisée - Django GRH
        </div>
    </div>
</body>
</html>
